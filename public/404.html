<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelIsolate AI Background Remover</title>
    <script>
      (function() {
        var p = window.location.pathname;
        if (p.indexOf('/blog') === 0 || p.indexOf('/howto') === 0 || p.indexOf('/history') === 0 || p.indexOf('/billing') === 0) {
          window.location.replace('/?redirect=' + encodeURIComponent(p + window.location.search + window.location.hash));
        }
      })();
    </script>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --bg-color: #030712;
        --card-bg: rgba(15, 23, 42, 0.6);
        --accent: #10b981;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: rgba(255, 255, 255, 0.1);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 560px;
        padding: 2.5rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
        margin: 1rem;
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 800;
        margin: 0 0 0.75rem 0;
        letter-spacing: -0.025em;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 2rem 0;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, #10b981, #0d9488);
        color: #ffffff;
      }
      .btn-primary:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .nav-footer {
        margin-top: 2.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.75rem;
        color: var(--muted);
      }
      .nav-footer a {
        color: var(--muted);
        padding: 0 0.5rem;
      }
      .nav-footer a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">404 Error • Redirecting</div>
      <h1>Loading Requested Page...</h1>
      <p>Please wait while we redirect you to the requested workspace or blog article.</p>
      
      <div class="links">
        <a href="/" class="btn-primary">Return to Editor Studio</a>
        <a href="/blog" class="btn-secondary">View Blog Articles</a>
      </div>

      <div class="nav-footer">
        <a href="/">Home</a> •
        <a href="/blog">Blog</a> •
        <a href="/privacy">Privacy Policy</a> •
        <a href="/terms">Terms of Service</a> •
        <a href="/refund">Refund Policy</a>
      </div>
    </div>
  </body>
</html>
